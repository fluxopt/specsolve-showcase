name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The two halves, end to end: the job writes the archives, the site builds from them.
      - run: uv run showcase-solve --runs runs
      - run: uv run showcase-grid --runs grid
      - run: uv run marimo export html notebooks/session.py -o site/src/session.html
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          OBSERVABLE_TELEMETRY_DISABLE: "true"
      # The archives themselves, beside the site, for any client that reads parquet over HTTP.
      - run: uv run python -m tools.publish_archive site/dist/archive runs grid
      # The notebook, executable in the browser: marimo's WASM export, with our
      # wheels and the pathway model beside it, published under the site.
      - run: uv run marimo export html-wasm notebooks/session.py -o site/dist/session-app --mode run --execute --no-sandbox
      - run: uv run python -m tools.wasm_bundle site/dist/session-app
      - run: uv run marimo export html-wasm notebooks/session.py -o site/dist/session-edit --mode edit --execute --no-sandbox
      - run: uv run python -m tools.wasm_bundle site/dist/session-edit
