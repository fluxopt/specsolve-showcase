name: Deploy

# Solve every scenario, build the site from the archives, and publish it to
# GitHub Pages. This is the whole production pipeline: the runner is the
# scheduler, the archive is the artifact, Pages is the host.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: uv sync --all-extras --locked
      - run: uv run showcase-solve --runs runs
      - run: uv run showcase-grid --runs grid
      - run: uv run marimo export html notebooks/session.py -o site/src/session.html
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          OBSERVABLE_TELEMETRY_DISABLE: "true"
      # The archives themselves, beside the site, for any client that reads parquet over HTTP.
      - run: uv run python -m tools.publish_archive site/dist/archive runs grid
      # The notebook, executable in the browser: marimo's WASM export, with our
      # wheels and the pathway model beside it, published under the site.
      - run: uv run marimo export html-wasm notebooks/session.py -o site/dist/session-app --mode run --execute --no-sandbox
      - run: uv run python -m tools.wasm_bundle site/dist/session-app
      - run: uv run marimo export html-wasm notebooks/session.py -o site/dist/session-edit --mode edit --execute --no-sandbox
      - run: uv run python -m tools.wasm_bundle site/dist/session-edit
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
