[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specsolve-showcase"
version = "0.1.0"
description = "A capacity-expansion planner on specsolve: a solve job, an archive directory, and a static site that reads it."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Felix Bumann", email = "felixbumann387@gmail.com" }]
# What a reader of the archive needs, and nothing the solve job does.
dependencies = [
    "duckdb>=1.3",
    "polars>=1.30",
    "pyarrow>=17",
]

[project.optional-dependencies]
# What the solve job needs on top.
solve = ["specsolve>=0.6.2,<0.7"]
# What the modelling-session notebook needs on top of the solve job.
lab = ["specsolve-showcase[solve]", "marimo>=0.15", "altair>=5.4"]
# What the solve server needs on top of the solve job. Nothing else in the
# repository imports it, and the site builds with it absent.
server = ["specsolve-showcase[solve]", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
showcase-solve = "showcase.solve:main"
showcase-grid = "showcase.solve:grid_main"
showcase-hedge = "showcase.solve:hedge_main"
showcase-serve = "server.app:main"

[project.urls]
repository = "https://github.com/fluxopt/specsolve-showcase"

[dependency-groups]
# pip: tools/wasm_bundle.py downloads wheels with it.
dev = ["pip>=24", "pytest>=8", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/showcase", "server"]

# The notebook exported to the browser runs its cells on load, in edit mode too.
[tool.marimo.runtime]
auto_instantiate = true

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "UP", "SIM", "RUF", "C4", "PIE", "RET", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A bare expression at the end of a marimo cell is its output.
"notebooks/**/*.py" = ["B018"]
# A script reports by printing.
"tools/**/*.py" = ["T20"]
# A client is a script a reader runs; it reports by printing, and its lambdas
# are the reason it is ten lines rather than twenty.
"clients/**/*.py" = ["T20", "E731"]

[tool.ruff.format]
quote-style = "single"
